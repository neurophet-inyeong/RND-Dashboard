<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>R&D 성과지표 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #f3f5f8;
      --sidebar: #e9ecf2;
      --panel: #ffffff;
      --soft-panel: #eef1f7;
      --line: #d8dde7;
      --text: #1d2a40;
      --muted: #5f6d86;
      --accent: #4a66ff;
      --danger: #f14d4d;
      --dark: #4c4c4c;
      --radius: 14px;
      --shadow: 0 10px 24px rgba(27, 45, 75, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--sidebar);
      border-right: 1px solid #d2d8e3;
      padding: 22px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .logo {
      font-weight: 800;
      font-size: 2rem;
      padding-bottom: 12px;
      border-bottom: 1px solid #cfd6e2;
    }

    .s-title {
      font-weight: 800;
      color: #2a3b56;
      margin: 4px 0 6px;
    }

    .menu-list {
      display: grid;
      gap: 8px;
    }

    .menu-btn {
      border: 1px solid #ccd4e2;
      background: #f8faff;
      color: #2d3c55;
      border-radius: 10px;
      padding: 10px 12px;
      text-align: left;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .menu-btn.active {
      background: linear-gradient(135deg, #5570ff, #435ad0);
      color: #fff;
      border-color: #435ad0;
      box-shadow: 0 8px 18px rgba(67, 90, 208, 0.28);
    }

    .menu-btn.secondary {
      background: #fff;
      font-weight: 600;
    }

    .divider {
      margin-top: 8px;
      border-top: 1px solid #cfd6e2;
      padding-top: 12px;
    }

    .main {
      padding: 24px 24px 30px;
      display: grid;
      gap: 16px;
      align-content: start;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-title {
      margin: 0;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .refresh-btn {
      border: 1px solid #c6cede;
      background: #fff;
      color: #30425f;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
    }

    .meta {
      display: grid;
      gap: 6px;
      width: 260px;
    }

    .meta label {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .meta input {
      border: 1px solid #d3d9e5;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.95rem;
      color: #2f3f5e;
      background: #fff;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px;
    }

    .overview-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 0;
      font-size: 0.92rem;
    }

    .overview-table th,
    .overview-table td {
      border-bottom: 1px solid #e8edf5;
      padding: 8px 10px;
      vertical-align: top;
      white-space: normal;
      word-break: break-word;
    }

    .overview-table th {
      width: 180px;
      background: transparent;
      color: #5f7090;
      font-weight: 700;
      position: static;
    }

    .overview-table td {
      color: #23395f;
      font-weight: 600;
    }

    .sheet-stack {
      display: grid;
      gap: 12px;
    }

    .subtabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .subtab-btn {
      border: 1px solid #cfd7e6;
      background: #f7f9ff;
      color: #2e4164;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .subtab-btn.active {
      background: linear-gradient(135deg, #5570ff, #435ad0);
      border-color: #435ad0;
      color: #fff;
      box-shadow: 0 6px 14px rgba(67, 90, 208, 0.25);
    }

    .merged-sheet {
      display: grid;
      gap: 14px;
    }

    .merged-title {
      margin-bottom: 6px;
      color: #33486f;
      font-weight: 800;
      font-size: 0.92rem;
    }

    .card-title {
      margin: 0 0 8px;
      font-weight: 800;
      color: #2f3f5e;
      font-size: 1.02rem;
    }

    .table-wrap {
      max-height: 310px;
      overflow: auto;
      border: 1px solid #dce3ef;
      border-radius: 10px;
      background: #fff;
    }

    .table-wrap table.multi-head th {
      position: static;
      background: #f4f7fd;
    }

    .sheet-table thead th {
      text-align: center;
    }

    .sheet-table tbody td.num-cell {
      text-align: right !important;
    }

    .sheet-table tbody td.txt-cell {
      text-align: left !important;
    }

    .sheet-table tbody td.mid-cell {
      text-align: center !important;
    }

    .sheet-table thead th.metric-target,
    .sheet-table tbody td.metric-target {
      background: #eef4ff;
    }

    .sheet-table thead th.metric-achieve,
    .sheet-table tbody td.metric-achieve {
      background: #eefaf2;
    }

    .sheet-table tbody td.metric-rate {
      font-weight: 700;
    }

    .sheet-table tbody td.metric-rate.status-ok {
      color: #137a2c;
    }

    .sheet-table tbody td.metric-rate.status-miss {
      color: #bf2f2f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
      font-size: 0.9rem;
    }

    th,
    td {
      text-align: left;
      border-bottom: 1px solid #ecf0f7;
      padding: 8px 10px;
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #f4f7fd;
      color: #3a4f74;
      z-index: 1;
    }

    .hint {
      margin: 2px 0 0;
      color: #6a7b99;
      font-size: 0.84rem;
    }

    .warn {
      border: 1px solid #f1d3a4;
      background: #fff6e8;
      color: #8a5b11;
      border-radius: 10px;
      padding: 9px 10px;
      font-size: 0.87rem;
      display: none;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 1200px) {
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #d2d8e3;
      }
      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .meta {
        width: 100%;
        max-width: 300px;
      }
      .overview-table th {
        width: 130px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">RnD Dashboard</div>

      <div>
        <div class="s-title">Project Data</div>
        <div id="projectMenu" class="menu-list"></div>
      </div>

      <div class="divider">
        <button id="reloadProjectBtn" class="menu-btn secondary">프로젝트 폴더 다시 읽기</button>
        <button id="uploadBtn" class="menu-btn secondary">엑셀 직접 업로드</button>
        <input id="fileInput" class="hidden" type="file" accept=".xlsx,.xls,.xlsm" multiple />
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 class="page-title">과제 현황</h1>
        <button id="refreshBtn" class="refresh-btn">데이터 새로고침</button>
      </div>

      <div class="meta">
        <label for="baseDate">조회 기준일</label>
        <input id="baseDate" type="text" readonly />
      </div>

      <div id="message" class="warn"></div>

      <section class="card">
        <h2 class="card-title">개요</h2>
        <div class="table-wrap">
          <div id="overviewGrid"></div>
        </div>
      </section>

      <section class="sheet-stack">
        <article class="card">
          <h2 class="card-title">시트 상세</h2>
          <div id="sheetTabs" class="subtabs"></div>
          <p id="sheetHint" class="hint"></p>
          <div id="activeSheetWrap" class="table-wrap"></div>
        </article>
      </section>
    </main>
  </div>

  <script>
    const state = {
      projects: [],
      activeProject: "",
      activeSheetTab: "사업비"
    };
    let lastReloadToken = "";

    const projectMenu = document.getElementById("projectMenu");
    const reloadProjectBtn = document.getElementById("reloadProjectBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const fileInput = document.getElementById("fileInput");
    const messageEl = document.getElementById("message");
    const baseDate = document.getElementById("baseDate");

    const overviewGrid = document.getElementById("overviewGrid");
    const sheetTabs = document.getElementById("sheetTabs");
    const sheetHint = document.getElementById("sheetHint");
    const activeSheetWrap = document.getElementById("activeSheetWrap");

    const SHEET_TABS = [
      { key: "사업비", label: "사업비", hint: "사업비 시트 상위 120행" },
      { key: "마일스톤", label: "마일스톤", hint: "마일스톤 시트 상위 120행" },
      { key: "정량지표묶음", label: "정량지표", hint: "정량지표 + 정량지표상세 시트 상위 120행" }
    ];

    function setMessage(text) {
      if (!text) {
        messageEl.style.display = "none";
        messageEl.textContent = "";
        return;
      }
      messageEl.style.display = "block";
      messageEl.textContent = text;
    }

    function formatDateToday() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const dd = String(d.getDate()).padStart(2, "0");
      return `${yyyy}/${mm}/${dd}`;
    }

    function normalizeKey(key) {
      return String(key || "")
        .replace(/[\n\r]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function isExcelPath(path) {
      return /\.(xlsx|xls|xlsm)$/i.test(path);
    }

    function sheetRows(workbook, sheetName, headerRow = 1) {
      if (!workbook.Sheets[sheetName]) return [];
      const ws = workbook.Sheets[sheetName];

      if (headerRow <= 1) {
        const rows = XLSX.utils.sheet_to_json(ws, { defval: null });
        return rows.map((row) => {
          const out = {};
          for (const [k, v] of Object.entries(row)) {
            out[normalizeKey(k) || "미지정"] = v;
          }
          return out;
        });
      }

      const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      const headerIdx = Math.max(0, headerRow - 1);
      const headerRaw = matrix[headerIdx] || [];
      const header = headerRaw.map((h, i) => normalizeKey(h) || `미지정_${i + 1}`);
      const body = matrix.slice(headerIdx + 1);

      return body
        .filter((r) => Array.isArray(r) && r.some((v) => v !== null && String(v).trim() !== ""))
        .map((r) => {
          const out = {};
          header.forEach((h, i) => {
            out[h] = r[i] ?? null;
          });
          return out;
        });
    }

    function makeUniqueHeaders(headers) {
      const counter = new Map();
      return headers.map((h, idx) => {
        const base = normalizeKey(h) || `미지정_${idx + 1}`;
        const n = (counter.get(base) || 0) + 1;
        counter.set(base, n);
        return n === 1 ? base : `${base}_${n}`;
      });
    }

    function parseMilestoneRows(workbook, sheetName) {
      const ws = workbook.Sheets[sheetName];
      if (!ws) return [];

      const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      const groupRaw = (matrix[0] || []).map((v) => normalizeKey(v));
      const subRaw = (matrix[1] || []).map((v, i) => normalizeKey(v) || `미지정_${i + 1}`);

      const groups = [];
      let carry = "";
      for (const g of groupRaw) {
        if (g) carry = g;
        groups.push(carry);
      }

      const combined = subRaw.map((sub, i) => {
        const grp = groups[i];
        if (grp === "계획" || grp === "실행") {
          return `${grp}|${sub}`;
        }
        return sub;
      });

      const header = makeUniqueHeaders(combined);
      const body = matrix.slice(2);

      return body
        .filter((r) => Array.isArray(r) && r.some((v) => v !== null && String(v).trim() !== ""))
        .map((r) => {
          const out = {};
          header.forEach((h, i) => {
            out[h] = r[i] ?? null;
          });
          return out;
        });
    }

    function parseMetricRows(workbook, sheetName) {
      const ws = workbook.Sheets[sheetName];
      if (!ws) return [];

      const matrix = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      const topRaw = matrix[0] || [];
      const subRaw = matrix[1] || [];

      const top = topRaw.map((v) => normalizeKey(v));
      const sub = subRaw.map((v) => normalizeKey(v));
      const groupedKeys = new Set(["목표", "달성"]);

      const combined = top.map((t, i) => {
        const s = sub[i] || "";

        if (groupedKeys.has(t)) {
          return `${t}|${s || `항목_${i + 1}`}`;
        }

        if (t && !/^Unnamed/i.test(t)) {
          return t;
        }

        if (s) {
          return s;
        }

        return `미지정_${i + 1}`;
      });

      const header = makeUniqueHeaders(combined);
      const body = matrix.slice(2);

      const parsedRows = body
        .filter((r) => Array.isArray(r) && r.some((v) => v !== null && String(v).trim() !== ""))
        .map((r) => {
          const out = {};
          header.forEach((h, i) => {
            out[h] = r[i] ?? null;
          });
          return out;
        });

      const rateCols = header.filter((h) => h.includes("연구개발 달성률"));
      if (!rateCols.length) {
        return parsedRows;
      }

      const mergedKey = "연구개발달성률";
      const firstIdx = header.findIndex((h) => rateCols.includes(h));
      const baseHeaders = header.filter((h) => !rateCols.includes(h));
      const finalHeaders = [...baseHeaders];
      finalHeaders.splice(Math.max(0, firstIdx), 0, mergedKey);

      return parsedRows.map((row) => {
        const merged = rateCols
          .map((col) => row[col])
          .filter((v) => v !== null && String(v).trim() !== "")
          .map((v) => String(v).trim())
          .join(" / ");

        const out = {};
        finalHeaders.forEach((h) => {
          if (h === mergedKey) {
            out[h] = merged;
          } else {
            out[h] = row[h] ?? null;
          }
        });
        return out;
      });
    }

    function getActiveProject() {
      if (!state.projects.length) return null;
      if (!state.activeProject) return state.projects[0];
      return state.projects.find((p) => p.name === state.activeProject) || state.projects[0];
    }

    function renderProjectMenu() {
      projectMenu.innerHTML = "";
      for (const project of state.projects) {
        const btn = document.createElement("button");
        btn.className = `menu-btn${project.name === state.activeProject ? " active" : ""}`;
        btn.textContent = `📊 ${project.name}`;
        btn.addEventListener("click", () => {
          state.activeProject = project.name;
          renderProjectMenu();
          renderDashboard();
        });
        projectMenu.appendChild(btn);
      }
    }

    function renderOverview(project) {
      const rows = project.sheets["개요"] || [];
      if (!rows.length) {
        overviewGrid.innerHTML = "개요 데이터가 없습니다.";
        return;
      }

      const fields = [];
      rows.forEach((row) => {
        const entries = Object.entries(row).filter(([, v]) => v !== null && String(v).trim() !== "");
        if (entries.length >= 2) {
          const key = String(entries[0][1] ?? entries[0][0]).trim();
          const value = String(entries[1][1] ?? "").trim();
          if (key && value) {
            fields.push({ key, value });
          }
        }
      });

      const dedup = [];
      const seen = new Set();
      for (const item of fields) {
        const signature = `${item.key}::${item.value}`;
        if (!seen.has(signature)) {
          dedup.push(item);
          seen.add(signature);
        }
      }

      const finalItems = dedup.length ? dedup : [{ key: "안내", value: "개요 시트 형식을 확인해주세요." }];
      const body = finalItems
        .map((item) => `<tr><th>${item.key}</th><td>${item.value}</td></tr>`)
        .join("");

      overviewGrid.innerHTML = `<table class="overview-table"><tbody>${body}</tbody></table>`;
    }

    function toYmd(value) {
      if (value === null || value === undefined || value === "") return "";

      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        const yyyy = value.getFullYear();
        const mm = String(value.getMonth() + 1).padStart(2, "0");
        const dd = String(value.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      if (typeof value === "number") {
        const parsed = XLSX.SSF.parse_date_code(value);
        if (parsed) {
          const yyyy = String(parsed.y).padStart(4, "0");
          const mm = String(parsed.m).padStart(2, "0");
          const dd = String(parsed.d).padStart(2, "0");
          return `${yyyy}-${mm}-${dd}`;
        }
      }

      const text = String(value).trim();
      if (!text) return "";

      const normalized = text.replace(/\./g, "-").replace(/\//g, "-");
      const exact = normalized.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (exact) {
        const yyyy = exact[1];
        const mm = String(Number(exact[2])).padStart(2, "0");
        const dd = String(Number(exact[3])).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      const d = new Date(text);
      if (!Number.isNaN(d.getTime())) {
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }

      return text;
    }

    function parseNumericLike(value) {
      if (typeof value === "number") return Number.isFinite(value) ? value : Number.NaN;
      const text = String(value ?? "").replace(/,/g, "").trim();
      if (!text) return Number.NaN;
      const num = Number(text);
      return Number.isFinite(num) ? num : Number.NaN;
    }

    function formatBudgetCell(column, value) {
      if (value === null || value === undefined) return "";

      if (column.includes("시작일") || column.includes("종료일")) {
        return toYmd(value);
      }

      const num = parseNumericLike(value);
      if (!Number.isNaN(num)) {
        if (num === 0) return "";
        if (Number.isInteger(num)) return num.toLocaleString("ko-KR");
        return num.toLocaleString("ko-KR", { maximumFractionDigits: 4 });
      }

      const text = String(value);
      return text.trim() === "0" ? "" : text;
    }

    function formatMilestoneCell(column, value) {
      if (value === null || value === undefined) return "";
      if (column.includes("시작일") || column.includes("종료일")) {
        return toYmd(value);
      }
      return value ?? "";
    }

    function milestoneThead(columns) {
      const tokens = columns.map((col) => {
        const parts = String(col).split("|");
        if (parts.length >= 2 && (parts[0] === "계획" || parts[0] === "실행")) {
          return { grouped: true, group: parts[0], label: parts.slice(1).join("|") };
        }
        return { grouped: false, group: "", label: col };
      });

      const hasGrouped = tokens.some((t) => t.grouped);
      if (!hasGrouped) {
        return `<thead><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead>`;
      }

      let row1 = "";
      let i = 0;
      while (i < tokens.length) {
        const t = tokens[i];
        if (!t.grouped) {
          row1 += `<th rowspan="2">${t.label}</th>`;
          i += 1;
          continue;
        }

        let span = 1;
        while (i + span < tokens.length && tokens[i + span].grouped && tokens[i + span].group === t.group) {
          span += 1;
        }
        row1 += `<th colspan="${span}">${t.group}</th>`;
        i += span;
      }

      const row2 = tokens
        .filter((t) => t.grouped)
        .map((t) => `<th>${t.label}</th>`)
        .join("");

      return `<thead><tr>${row1}</tr><tr>${row2}</tr></thead>`;
    }

    function metricThead(columns) {
      const tokens = columns.map((col) => {
        const parts = String(col).split("|");
        if (parts.length >= 2 && (parts[0] === "목표" || parts[0] === "달성")) {
          return { grouped: true, group: parts[0], label: parts.slice(1).join("|") };
        }
        return { grouped: false, group: "", label: col };
      });

      const hasGrouped = tokens.some((t) => t.grouped);
      if (!hasGrouped) {
        return `<thead><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead>`;
      }

      let row1 = "";
      let i = 0;
      while (i < tokens.length) {
        const t = tokens[i];
        if (!t.grouped) {
          row1 += `<th rowspan="2">${t.label}</th>`;
          i += 1;
          continue;
        }

        let span = 1;
        while (i + span < tokens.length && tokens[i + span].grouped && tokens[i + span].group === t.group) {
          span += 1;
        }
        const groupCls = t.group === "목표" ? "metric-target" : "metric-achieve";
        row1 += `<th colspan="${span}" class="${groupCls}">${t.group}</th>`;
        i += span;
      }

      const row2 = tokens
        .filter((t) => t.grouped)
        .map((t) => {
          const groupCls = t.group === "목표" ? "metric-target" : "metric-achieve";
          return `<th class="${groupCls}">${t.label}</th>`;
        })
        .join("");

      return `<thead><tr>${row1}</tr><tr>${row2}</tr></thead>`;
    }

    function buildSheetTableHtml(rows, sectionName = "") {
      if (!rows.length) {
        return "데이터가 없습니다.";
      }

      const columns = Object.keys(rows[0]);
      const display = rows.slice(0, 120);

      const formatter = sectionName === "사업비"
        ? (col, val) => formatBudgetCell(col, val)
        : sectionName === "마일스톤"
          ? (col, val) => formatMilestoneCell(col, val)
          : (_col, val) => (val ?? "");

      const commaNumberRe = /^-?\d{1,3}(,\d{3})+(\.\d+)?$/;

      const thead = sectionName === "마일스톤"
        ? milestoneThead(columns)
        : sectionName === "정량지표"
          ? metricThead(columns)
          : `<thead><tr>${columns.map((c) => `<th>${c}</th>`).join("")}</tr></thead>`;
      const tbody = `<tbody>${display
        .map((row) => `<tr>${columns.map((c) => {
          const formatted = formatter(c, row[c]);
          const text = String(formatted ?? "").trim();
          const rawNum = parseNumericLike(row[c]);
          const formattedNum = parseNumericLike(formatted);

          let cls = "txt-cell";
          if (commaNumberRe.test(text)) {
            cls = "num-cell";
          } else if (!Number.isNaN(rawNum) || !Number.isNaN(formattedNum)) {
            cls = "mid-cell";
          }

          const clsList = [cls];
          if (sectionName === "정량지표") {
            if (c.startsWith("목표|")) {
              clsList.push("metric-target");
            } else if (c.startsWith("달성|")) {
              clsList.push("metric-achieve");
            }

            if (c.includes("달성률")) {
              clsList.push("metric-rate");
              if (text.includes("달성") && !text.includes("미달성")) {
                clsList.push("status-ok");
              } else if (text.includes("미달성")) {
                clsList.push("status-miss");
              }
            }
          }

          return `<td class="${clsList.join(" ")}">${formatted}</td>`;
        }).join("")}</tr>`)
        .join("")}</tbody>`;
      const classList = ["sheet-table"];
      if (sectionName === "마일스톤" || sectionName === "정량지표") {
        classList.push("multi-head");
      }
      const tableClass = classList.join(" ");
      return `<table class="${tableClass}">${thead}${tbody}</table>`;
    }

    function renderSheetTable(rows, targetWrap, sectionName = "") {
      targetWrap.innerHTML = buildSheetTableHtml(rows, sectionName);
    }

    function renderSheetTabs(project) {
      sheetTabs.innerHTML = "";

      if (!SHEET_TABS.some((t) => t.key === state.activeSheetTab)) {
        state.activeSheetTab = "사업비";
      }

      for (const tab of SHEET_TABS) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `subtab-btn${tab.key === state.activeSheetTab ? " active" : ""}`;
        btn.textContent = tab.label;
        btn.addEventListener("click", () => {
          state.activeSheetTab = tab.key;
          renderSheetTabs(project);
          renderActiveSheet(project);
        });
        sheetTabs.appendChild(btn);
      }
    }

    function renderActiveSheet(project) {
      const tab = SHEET_TABS.find((t) => t.key === state.activeSheetTab) || SHEET_TABS[0];
      sheetHint.textContent = tab.hint;

      if (tab.key === "정량지표묶음") {
        const metricRows = project.sheets["정량지표"] || [];
        const metricDetailRows = project.sheets["정량지표상세"] || [];

        activeSheetWrap.innerHTML = `
          <div class="merged-sheet">
            <div>
              <div class="merged-title">정량지표</div>
              ${buildSheetTableHtml(metricRows, "정량지표")}
            </div>
            <div>
              <div class="merged-title">정량지표상세</div>
              ${buildSheetTableHtml(metricDetailRows, "정량지표상세")}
            </div>
          </div>
        `;
        return;
      }

      const rows = project.sheets[tab.key] || [];
      renderSheetTable(rows, activeSheetWrap, tab.key);
    }

    function renderDashboard() {
      const project = getActiveProject();
      if (!project) return;

      renderOverview(project);
      renderSheetTabs(project);
      renderActiveSheet(project);
    }

    async function parseFiles(fileEntries) {
      if (typeof XLSX === "undefined") {
        throw new Error("XLSX 라이브러리를 불러오지 못했습니다. 네트워크/CDN 접근을 확인해주세요.");
      }

      const projects = [];
      for (const fileEntry of fileEntries) {
        const name = fileEntry.name.replace(/\.[^.]+$/, "");
        const data = await fileEntry.arrayBuffer();
        const wb = XLSX.read(data, { type: "array" });
        const sheets = {};
        wb.SheetNames.forEach((sheetName) => {
          if (sheetName === "마일스톤") {
            sheets[sheetName] = parseMilestoneRows(wb, sheetName);
          } else if (sheetName === "정량지표") {
            sheets[sheetName] = parseMetricRows(wb, sheetName);
          } else {
            sheets[sheetName] = sheetRows(wb, sheetName, 1);
          }
        });
        projects.push({ name, sheets });
      }
      return projects;
    }

    async function discoverProjectExcelPaths() {
      const resp = await fetch("projects/");
      if (!resp.ok) throw new Error("projects 폴더 접근 실패");

      const html = await resp.text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const anchors = Array.from(doc.querySelectorAll("a[href]"));
      const paths = anchors
        .map((a) => a.getAttribute("href") || "")
        .filter((href) => href && !href.startsWith("?") && !href.startsWith("#"))
        .map((href) => decodeURIComponent(href))
        .filter((href) => !href.startsWith("../") && isExcelPath(href))
        .map((href) => `projects/${href.replace(/^\.\//, "")}`);

      return Array.from(new Set(paths));
    }

    async function loadFilesIntoDashboard(files, sourceLabel) {
      state.projects = await parseFiles(files);
      if (!state.projects.length) {
        setMessage("불러온 엑셀 데이터가 없습니다.");
        return;
      }

      if (!state.projects.some((p) => p.name === state.activeProject)) {
        state.activeProject = state.projects[0].name;
      }

      renderProjectMenu();
      renderDashboard();
      setMessage(`${sourceLabel}에서 ${state.projects.length}개 과제를 불러왔습니다.`);
    }

    async function loadProjectFolder(silent = false) {
      try {
        const paths = await discoverProjectExcelPaths();
        if (!paths.length) throw new Error("projects 폴더에서 엑셀 파일을 찾지 못했습니다.");

        const files = [];
        for (const path of paths) {
          const resp = await fetch(path);
          if (!resp.ok) throw new Error(`${path} 로딩 실패`);
          const blob = await resp.blob();
          files.push(new File([blob], path.split("/").pop(), { type: blob.type }));
        }

        await loadFilesIntoDashboard(files, "projects 폴더");
      } catch (err) {
        if (!silent) {
          setMessage(`projects 자동 로딩 실패: ${err.message}`);
        }
      }
    }

    async function loadFromInput() {
      if (!fileInput.files || !fileInput.files.length) {
        setMessage("업로드할 엑셀 파일을 선택해주세요.");
        return;
      }
      const files = Array.from(fileInput.files);
      await loadFilesIntoDashboard(files, "업로드 파일");
    }

    async function checkReloadToken() {
      try {
        const resp = await fetch(`.watch/reload-token.json?t=${Date.now()}`, { cache: "no-store" });
        if (!resp.ok) return;
        const payload = await resp.json();
        const token = String(payload.token || "");
        if (!token) return;

        if (!lastReloadToken) {
          lastReloadToken = token;
          return;
        }

        if (token !== lastReloadToken) {
          location.reload();
        }
      } catch (_) {
        // Watcher not running or token file not available.
      }
    }

    function bindEvents() {
      uploadBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => {
        loadFromInput().catch((err) => setMessage(`파일 읽기 오류: ${err.message}`));
      });

      refreshBtn.addEventListener("click", () => {
        loadProjectFolder(false).catch((err) => setMessage(`새로고침 오류: ${err.message}`));
      });

      reloadProjectBtn.addEventListener("click", () => {
        loadProjectFolder(false).catch((err) => setMessage(`폴더 로딩 오류: ${err.message}`));
      });
    }

    function init() {
      baseDate.value = formatDateToday();
      bindEvents();
      checkReloadToken();
      setInterval(checkReloadToken, 3000);
      if (location.protocol === "file:") {
        setMessage("file:// 실행에서는 projects 자동 로딩이 제한됩니다. http://localhost:8080/dashboard.html 로 접속하거나 왼쪽에서 엑셀을 직접 업로드해주세요.");
      }

      loadProjectFolder(false).catch((err) => {
        setMessage(`자동 로딩에 실패했습니다: ${err.message}`);
      });
    }

    init();
  </script>
</body>
